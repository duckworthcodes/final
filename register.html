<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MahaPoojan - Create Account</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A1208 0%, #2E2316 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .logo { text-align: center; font-size: 48px; margin-bottom: 20px; }
        h1 { text-align: center; color: #C6721B; font-size: 28px; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7A6040; margin-bottom: 30px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #3D2D12; font-weight: 500; }
        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E0D5C0;
            border-radius: 12px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #C6721B;
            box-shadow: 0 0 0 3px rgba(198,114,27,0.1);
        }
        .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button {
            width: 100%;
            background: #C6721B;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #9E4F08; transform: translateY(-2px); }
        .google-btn {
            background: white;
            color: #3D2D12;
            border: 1px solid #E0D5C0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .google-btn:hover { background: #FAF6EE; transform: translateY(-2px); }
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #E0D5C0;
        }
        .divider span {
            background: white;
            padding: 0 15px;
            position: relative;
            color: #7A6040;
        }
        .login-link { text-align: center; margin-top: 20px; color: #7A6040; }
        .login-link a { color: #C6721B; text-decoration: none; font-weight: 600; }
        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .success {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #C6721B;
        }
    </style>
    <script type="module">
        import { registerWithEmail, loginWithGoogle } from './firebase-config.js';
        
        const API_URL = 'http://localhost:3000/api';
        
        document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const gotra = document.getElementById('gotra').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            // Register with Firebase
            const result = await registerWithEmail(email, password, name, phone);
            
            if (result.success) {
                // Save to your backend (optional - for storing puja history)
                try {
                    await fetch(`${API_URL}/users/save`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            uid: result.user.uid,
                            name: name,
                            email: email,
                            phone: phone,
                            gotra: gotra
                        })
                    });
                } catch (err) {
                    console.log('Backend save failed, but Firebase registration successful');
                }
                
                showSuccess(result.message);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } else {
                showError(result.error);
            }
            
            document.getElementById('loading').style.display = 'none';
        });
        
        // Google Sign Up
        window.googleSignUp = async () => {
            document.getElementById('loading').style.display = 'block';
            const result = await loginWithGoogle();
            if (result.success) {
                window.location.href = 'dashboard.html';
            } else {
                showError(result.error);
            }
            document.getElementById('loading').style.display = 'none';
        };
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMsg');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="logo">🪔</div>
        <h1>Create Account</h1>
        <p class="subtitle">Join MahaPoojan family</p>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        
        <form id="registerForm">
            <div class="name-row">
                <div class="input-group">
                    <label>Full Name *</label>
                    <input type="text" id="name" required placeholder="Rajesh Sharma">
                </div>
              <div class="input-group">
  <label>Gotra (Optional)</label>
  <input type="text" id="gotra" placeholder="Type to search gotra..." autocomplete="off" oninput="filterGotra(this.value)" onfocus="showGotraList()" onblur="setTimeout(hideGotraList, 150)">
  <ul id="gotra-list" style="display:none; position:absolute; background:#1a1a1a; border:1px solid #444; border-radius:8px; list-style:none; max-height:180px; overflow-y:auto; width:100%; z-index:99; margin-top:4px; padding:4px 0;">
  </ul>
    </div>

    <script>
    const GOTRAS = [
  "Atri","Bharadvaja","Gautama","Jamadagni","Kashyapa",
  "Vashistha","Vishwamitra","Agastya","Angirasa","Bhrigu",
  "Garga","Kaushika","Mandavya","Parashar","Pulastya",
  "Sandilya","Shaunaka","Upamanyu","Vatsa","Kaundinya"
];

function showGotraList() {
  renderGotra(GOTRAS);
  document.getElementById("gotra-list").style.display = "block";
}
function hideGotraList() {
  document.getElementById("gotra-list").style.display = "none";
}
function filterGotra(val) {
  const filtered = GOTRAS.filter(g => g.toLowerCase().startsWith(val.toLowerCase()));
  renderGotra(filtered.length ? filtered : GOTRAS.filter(g => g.toLowerCase().includes(val.toLowerCase())));
  document.getElementById("gotra-list").style.display = "block";
}
function renderGotra(list) {
  document.getElementById("gotra-list").innerHTML = list.map(g =>
    `<li onclick="selectGotra('${g}')" style="padding:8px 14px; cursor:pointer; font-size:0.85rem;" onmouseover="this.style.background='#333'" onmouseout="this.style.background='transparent'">${g}</li>`
  ).join("");
}
function selectGotra(val) {
  document.getElementById("gotra").value = val;
  hideGotraList();
}
</script>
            </div>
            <div class="input-group">
                <label>Email Address *</label>
                <input type="email" id="email" required placeholder="devotee@example.com">
            </div>
            <div class="input-group">
                <label>WhatsApp Number *</label>
                <input type="tel" id="phone" required placeholder="+91 98765 43210">
            </div>
            <div class="input-group">
                <label>Password *</label>
                <input type="password" id="password" required placeholder="Minimum 6 characters">
            </div>
            <div class="input-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" required placeholder="Re-enter password">
            </div>
            <button type="submit">Register with Email</button>
        </form>
        
        <div class="divider"><span>OR</span></div>
        
        <button class="google-btn" onclick="googleSignUp()">
            🔐 Continue with Google
        </button>
        
        <div id="loading" class="loading">⏳ Creating your account...</div>
        
        <div class="login-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>
</body>
</html>

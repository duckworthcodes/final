<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google" content="notranslate" id="gt-meta">
<script src="//translate.google.com/translate_a/element.js
  ?cb=googleTranslateElementInit"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MahaPoojan · Live Darshan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #0B0700;
  --bg2:      #130D02;
  --border:   rgba(212,168,83,0.18);
  --gold:     #D4A853;
  --saffron:  #C6721B;
  --light:    #F5C77E;
  --muted:    rgba(255,255,255,0.45);
}

body {
  background: var(--bg);
  color: #fff;
  font-family: 'Jost', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--saffron); border-radius: 10px; }

/* ── NAV ── */
nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 5vw;
  border-bottom: 1px solid var(--border);
  background: rgba(11,7,0,0.92);
  backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.5rem;
  font-weight: 600;
  background: linear-gradient(135deg, var(--light) 30%, var(--gold) 80%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  letter-spacing: 0.02em;
}
.nav-dot {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  text-transform: uppercase;
}
.pulse {
  width: 7px; height: 7px;
  background: #ff4d4d;
  border-radius: 50%;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.3; transform: scale(1.6); }
}

/* ── PLAYER ── */
.player-wrap {
  padding: 2rem 5vw 1.5rem;
}
.player-shell {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 1.5rem;
  overflow: hidden;
  position: relative;
}

/* incense smoke top-border glow */
.player-shell::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), var(--saffron), var(--gold), transparent);
  opacity: 0.7;
  z-index: 2;
}

.player-box {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  position: relative;
}
.player-box iframe {
  width: 100%; height: 100%;
  border: none;
  display: block;
}

/* placeholder shown when nothing is selected */
.player-placeholder {
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  background: radial-gradient(ellipse at center, #1C1004 0%, #0B0700 70%);
  position: absolute;
  inset: 0;
}
.player-placeholder .om {
  font-size: 3.5rem;
  opacity: 0.35;
  animation: breathe 3s ease-in-out infinite;
}
@keyframes breathe {
  0%, 100% { opacity: 0.25; transform: scale(1);   }
  50%       { opacity: 0.55; transform: scale(1.07); }
}
.player-placeholder p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 300;
  color: var(--muted);
}
.player-placeholder p em { color: var(--gold); font-style: italic; }

/* info bar below video */
.player-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.8rem;
  padding: 1rem 1.4rem;
  border-top: 1px solid var(--border);
}
.now-playing {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.35rem;
  font-weight: 600;
}
.now-sub {
  font-size: 0.68rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  margin-top: 0.15rem;
}
.player-badge {
  font-size: 0.65rem;
  padding: 0.3rem 0.9rem;
  border-radius: 2rem;
  background: rgba(198,114,27,0.15);
  border: 1px solid rgba(198,114,27,0.3);
  color: var(--light);
  letter-spacing: 0.06em;
}

/* ── SECTION LABEL ── */
.section-head {
  padding: 0.5rem 5vw 0.8rem;
  display: flex;
  align-items: baseline;
  gap: 1rem;
}
.section-head h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 400;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.section-head .line {
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── FILTER CHIPS ── */
.filters {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  padding: 0 5vw 1.2rem;
}
.chip {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.3rem 0.9rem;
  border-radius: 2rem;
  font-size: 0.68rem;
  font-family: 'Jost', sans-serif;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.2s;
}
.chip:hover   { border-color: var(--gold); color: var(--gold); }
.chip.active  { background: var(--saffron); border-color: var(--saffron); color: #fff; }

/* ── TEMPLE GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
  padding: 0 5vw 3rem;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 1.2rem;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
  position: relative;
}
.card:hover {
  transform: translateY(-4px);
  border-color: rgba(212,168,83,0.45);
  box-shadow: 0 12px 40px rgba(198,114,27,0.12);
}
.card.playing {
  border-color: var(--saffron);
  box-shadow: 0 0 0 1px var(--saffron), 0 12px 40px rgba(198,114,27,0.2);
}

.card-thumb {
  height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  background: linear-gradient(145deg, #1E1305 0%, #0B0700 100%);
  position: relative;
}

/* deity-specific thumb tints */
.card[data-deity="Shiva"]   .card-thumb { background: linear-gradient(145deg, #0E1320, #0B0700); }
.card[data-deity="Vishnu"]  .card-thumb { background: linear-gradient(145deg, #0E1A14, #0B0700); }
.card[data-deity="Shakti"]  .card-thumb { background: linear-gradient(145deg, #1A0E14, #0B0700); }
.card[data-deity="Ganesh"]  .card-thumb { background: linear-gradient(145deg, #1A130A, #0B0700); }
.card[data-deity="Krishna"] .card-thumb { background: linear-gradient(145deg, #0D0E1A, #0B0700); }

.live-badge {
  position: absolute;
  top: 8px; left: 10px;
  background: #d93535;
  font-size: 0.52rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  padding: 0.18rem 0.55rem;
  border-radius: 20px;
}
.upcoming-badge {
  position: absolute;
  top: 8px; left: 10px;
  background: rgba(212,168,83,0.25);
  border: 1px solid rgba(212,168,83,0.4);
  color: var(--gold);
  font-size: 0.5rem;
  letter-spacing: 0.08em;
  padding: 0.18rem 0.55rem;
  border-radius: 20px;
}
.playing-indicator {
  position: absolute;
  top: 8px; right: 10px;
  background: var(--saffron);
  font-size: 0.5rem;
  padding: 0.18rem 0.55rem;
  border-radius: 20px;
  letter-spacing: 0.06em;
}

.card-body {
  padding: 0.9rem 1rem 1.1rem;
}
.deity-label {
  font-size: 0.62rem;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 0.25rem;
}
.temple-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.2;
}
.temple-loc {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 0.2rem;
}
.watch-btn {
  display: block;
  width: 100%;
  margin-top: 0.85rem;
  padding: 0.5rem;
  border: 1px solid rgba(198,114,27,0.35);
  border-radius: 0.75rem;
  background: rgba(198,114,27,0.1);
  color: var(--light);
  font-family: 'Jost', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.watch-btn:hover, .card.playing .watch-btn {
  background: var(--saffron);
  border-color: var(--saffron);
  color: #fff;
}

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--border);
  padding: 1.5rem 5vw;
  text-align: center;
  font-size: 0.65rem;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.06em;
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .card-thumb { height: 80px; font-size: 2.2rem; }
  .temple-name { font-size: 0.95rem; }
  .now-playing { font-size: 1.1rem; }
}
@media (max-width: 380px) {
  .grid { grid-template-columns: 1fr; }
}

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  .pulse, .om { animation: none; }
  .card { transition: none; }
}
</style>
</head>
<body>

<!-- ── NAV ── -->
<nav>
  <div class="logo">🕉 MahaPoojan</div>
  <div class="nav-dot"><span class="pulse"></span> Live Darshan</div>
</nav>

<!-- ── PLAYER ── -->
<div class="player-wrap">
  <div class="player-shell">
    <div class="player-box">
      <div class="player-placeholder" id="placeholder">
        <div class="om">🕉</div>
        <p>Select a temple to begin <em>darshan</em></p>
      </div>
      <iframe id="player"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        style="display:none;">
      </iframe>
    </div>
    <div class="player-info">
      <div>
        <div class="now-playing" id="nowPlaying">—</div>
        <div class="now-sub" id="nowSub">Choose a stream below</div>
      </div>
      <div class="player-badge" id="playerBadge" style="display:none;">▶ Streaming</div>
    </div>
  </div>
</div>

<!-- ── FILTERS ── -->
<div class="section-head">
  <h2>Temples</h2>
  <div class="line"></div>
</div>
<div class="filters" id="filters">
  <button class="chip active" data-filter="all">All</button>
  <button class="chip" data-filter="live">🔴 Live</button>
  <button class="chip" data-filter="Shiva">Shiva</button>
  <button class="chip" data-filter="Vishnu">Vishnu</button>
  <button class="chip" data-filter="Shakti">Shakti</button>
  <button class="chip" data-filter="Ganesh">Ganesh</button>
  <button class="chip" data-filter="Krishna">Krishna</button>
</div>

<!-- ── GRID ── -->
<div class="grid" id="grid"></div>

<footer>© 2026 MahaPoojan &nbsp;·&nbsp; Jai Shri Ram 🙏</footer>

<script>
const temples = [
  { id:"kashi",         name:"Kashi Vishwanath",       deity:"Shiva",   loc:"Varanasi",    icon:"🔱", status:"live",     yt:"WPZ0xL0-sKs" },
  { id:"mahakal",       name:"Mahakaleshwar",           deity:"Shiva",   loc:"Ujjain",      icon:"🕉️", status:"live",     yt:"zirv0p7_JUs" },
  { id:"somnath",       name:"Somnath Temple",          deity:"Shiva",   loc:"Somnath",     icon:"🌊", status:"upcoming", yt:"1l9T4uMyTy0" },
  { id:"tirupati",      name:"Tirumala Venkateswara",   deity:"Vishnu",  loc:"Tirupati",    icon:"🌸", status:"live",     yt:"Unxt39MsYlw" },
  { id:"jagannath",     name:"Jagannath Puri",          deity:"Vishnu",  loc:"Puri",        icon:"🔆", status:"live",     yt:"wmZt_XypLmE" },
  { id:"vaishno",       name:"Vaishno Devi",            deity:"Shakti",  loc:"Katra",       icon:"🏔️", status:"live",     yt:"hC1yPs4CsmI" },
  { id:"meenakshi",     name:"Meenakshi Amman",         deity:"Shakti",  loc:"Madurai",     icon:"🌺", status:"upcoming", yt:"fn1Q0bLpSaE" },
  { id:"siddhivinayak", name:"Siddhivinayak",           deity:"Ganesh",  loc:"Mumbai",      icon:"🐘", status:"live",     yt:"poe5W9h1n_Q" },
  { id:"iskcon",        name:"ISKCON Vrindavan",        deity:"Krishna", loc:"Vrindavan",   icon:"🪈", status:"live",     yt:"bfIMsaPIcs4" },
];

let activeFilter = "all";
let playingId    = null;

function embedSrc(ytId) {
  return `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1`;
}

function play(id) {
  const t = temples.find(x => x.id === id);
  if (!t) return;
  playingId = id;

  // update player
  const frame = document.getElementById("player");
  const ph    = document.getElementById("placeholder");
  frame.src = embedSrc(t.yt);
  frame.style.display = "block";
  ph.style.display    = "none";

  // update info bar
  document.getElementById("nowPlaying").textContent = t.name;
  document.getElementById("nowSub").textContent     = `${t.deity} · ${t.loc}`;
  document.getElementById("playerBadge").style.display = "block";

  // scroll to player smoothly
  document.querySelector(".player-wrap").scrollIntoView({ behavior:"smooth", block:"start" });

  // re-render cards to reflect playing state
  renderGrid();
}

function renderGrid() {
  const list = temples.filter(t => {
    if (activeFilter === "all")  return true;
    if (activeFilter === "live") return t.status === "live";
    return t.deity === activeFilter;
  });

  document.getElementById("grid").innerHTML = list.map(t => `
    <div class="card ${t.id === playingId ? 'playing' : ''}"
         data-deity="${t.deity}"
         onclick="play('${t.id}')">
      <div class="card-thumb">
        ${t.icon}
        ${t.status === "live"
          ? `<span class="live-badge">● LIVE</span>`
          : `<span class="upcoming-badge">UPCOMING</span>`}
        ${t.id === playingId ? `<span class="playing-indicator">▶ NOW PLAYING</span>` : ""}
      </div>
      <div class="card-body">
        <div class="deity-label">${t.deity}</div>
        <div class="temple-name">${t.name}</div>
        <div class="temple-loc">📍 ${t.loc}</div>
        <button class="watch-btn">${t.id === playingId ? "▶ Watching" : "Watch Darshan"}</button>
      </div>
    </div>
  `).join("");
}

// filter chip logic
document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  activeFilter = chip.dataset.filter;
  renderGrid();
});

// init
renderGrid();
</script>
<script src="language.js"></script>

</body>
</html>
